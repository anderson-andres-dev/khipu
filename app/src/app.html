          };

          var DEFAULT_CHOICE = { family: 'datagrip', scheme: 'system' };

          try {
            var raw = localStorage.getItem('khipu:theme');
            if (raw) {
              var parsed = JSON.parse(raw);
              var familyOk = parsed && Object.prototype.hasOwnProperty.call(SHELL_PALETTES, parsed.family);
              var schemeOk =
                parsed &&
                (parsed.scheme === 'system' || parsed.scheme === 'dark' || parsed.scheme === 'light');
              if (familyOk && schemeOk) {
                choice = { family: parsed.family, scheme: parsed.scheme };
              }
            }
          } catch (e) {
            choice = DEFAULT_CHOICE;
          }

          var resolvedScheme = choice.scheme;
          if (resolvedScheme === 'system') {
            resolvedScheme =
              window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          }

          // One Dark, Dracula y Nord no tienen variante clara: se quedan en
          // oscuro, igual que resolveScheme() en palettes.ts.
          if (!SHELL_PALETTES[choice.family][resolvedScheme]) resolvedScheme = 'dark';

          var root = document.documentElement;
          for (var field in CSS_VAR_NAMES) {
            root.style.setProperty(CSS_VAR_NAMES[field], palette[field]);
          }
          root.style.colorScheme = resolvedScheme;
          // Mismo atributo que fija theme.ts: los pocos estilos que dependen
          // del esquema (degradados de identidad, alto contraste) lo leen.
          root.dataset.scheme = resolvedScheme;
        } catch (e) {
          // Si algo falla acá, se cae al CSS estático de tokens.css
          // (DataGrip Dark) — nunca debe romper el arranque de la app.
        }
